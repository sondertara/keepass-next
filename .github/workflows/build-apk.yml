name: Build KeePass Next APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Libre Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (assembleLibreDebug)
        run: |
          set -eo pipefail
          ./gradlew assembleLibreDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.log

      - name: Push Failure Log to Branch
        if: failure()
        run: |
          PASTE_URL=$(tail -n 300 /tmp/gradle_output.log | curl -s -F 'content=<-' https://dpaste.org/api/ || true)
          echo "PASTE_URL: $PASTE_URL"
          echo "### Gradle Build Failure Log: $PASTE_URL" >> $GITHUB_STEP_SUMMARY
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -B ci-debug-log
          echo "$PASTE_URL" > paste_url.txt
          tail -n 300 /tmp/gradle_output.log > gradle_failure.log
          git add -A
          git commit --allow-empty -m "ci failure: $PASTE_URL"
          git push -f origin ci-debug-log || true

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/libre/debug/ -name "*.apk" -exec cp {} build-output/KeePassNext-libre-debug.apk \;
          echo "Built APK files:"
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassNext-APK
          path: build-output/KeePassNext-libre-debug.apk
          retention-days: 30

      - name: Clean Up Legacy Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name == "build-failure" or (.tag_name | endswith("-custom")) or .draft == true) | .id'); do
            echo "Deleting legacy release ID: $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/KeePassNext-libre-debug.apk
          name: KeePass Next ${{ github.ref_name }}
          draft: false
          prerelease: false
